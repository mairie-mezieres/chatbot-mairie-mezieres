name: Détection de liens morts

# Les réponses de MEL contiennent des adresses officielles (service-public,
# ANTS, CCTVL, opérateur fibre…) écrites en dur dans lib/mel.js. Elles vieillissent
# sans prévenir : un domaine change, une page est déplacée, et MEL continue de
# l'annoncer aux habitants.
#
# Ce scan est né d'un cas réel : la réponse « carte d'identité » renvoyait vers
# le site d'une seule commune, et la règle « fibre » vers valdeloire-fibre.fr,
# un domaine qui n'existe pas. Le dépôt app-mezieres avait déjà ce workflow,
# mais il ne couvrait que ses propres pages HTML — donc rien côté backend.

on:
  schedule:
    # Tous les lundis à 07h30 UTC (30 min après celui de app-mezieres, pour ne
    # pas ouvrir deux issues au même instant).
    - cron: '30 7 * * 1'
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  liens-morts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Vérifier les liens
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          # Périmètre : le code qui porte des adresses montrées aux habitants
          # (lib/, routes/) et la documentation.
          #
          # Exclusions : les sites qui bloquent les robots, et les points
          # d'entrée d'API — ce ne sont pas des liens suivis par un humain et
          # ils répondent 401/404 sans clé ni paramètres.
          #
          # ⚠️ Un motif d'exclusion vieillit comme le lien qu'il couvre. Les
          # cinq « erreurs » de l'issue #181 étaient TOUTES des faux positifs,
          # dont trois dus à des motifs devenus faux :
          #   • `api.vigieau.beta.gouv.fr` — l'API a quitté le domaine `.beta`
          #     pour `api.vigieau.gouv.fr`, l'exclusion ne matchait plus rien ;
          #   • `upstash.io` — la route stats appelle `api.upstash.com` ;
          #   • `vigicrues.gouv.fr` n'était pas exclue du tout.
          # Les deux dernières sont les bases d'URL des visuels
          # (`mezieres-lez-clery.fr/img/…`) : ce sont des PRÉFIXES, jamais
          # requis tels quels — le code y concatène un nom de fichier. Servies
          # par GitHub Pages, elles répondent donc 404 en tant que répertoire,
          # alors que les 34 images existent bien.
          # En cas de doute sur un signalement, vérifier d'abord si l'URL est
          # réellement suivie par un humain avant de la croire cassée.
          #
          # ⚠️ `--exclude` ne peut PAS neutraliser une erreur de PARSING.
          # Le filtre s'applique à des URL déjà parsées ; quand lychee n'arrive
          # pas à construire l'URL, il échoue avant d'y arriver. Le message
          # d'erreur de routes/docs.js disait « url (https://…) ou fileB64
          # requis » — les points de suspension sont un ESPACE RÉSERVÉ dans un
          # texte, pas une adresse, et lychee échouait dessus sur « invalid
          # international domain name ». L'exclusion `^https://…$` ajoutée pour
          # ça n'a rien changé : le scan du 10 août l'a re-signalée, et l'issue
          # #181 est restée ouverte sur ce seul faux positif. La seule issue est
          # de ne pas écrire d'adresse factice dans le code : le message dit
          # maintenant « url (adresse en https) ». Ne pas réintroduire de
          # `https://` littéral suivi d'un espace réservé dans lib/ ou routes/.
          # ⚠️ Concurrence et délai : lychee lance par défaut jusqu'à 128 requêtes
          # en parallèle, et abandonne au bout de 20 s. service-public.gouv.fr —
          # de loin le domaine le plus cité par les réponses de MEL — étrangle
          # cette rafale et laisse expirer une partie des requêtes. C'est
          # exactement l'issue #201 : trois « TIMEOUT » sur R11193 et R16396,
          # deux pages parfaitement vivantes, pendant que le scan du dépôt
          # app-mezieres, dix minutes plus tôt et sur moins d'URL, obtenait du
          # même domaine un vrai 404 bien net. Un faux positif coûte plus cher
          # qu'un scan lent : il faut le ré-instruire à la main, et il apprend
          # à se méfier du signal. 8 requêtes en parallèle et 30 s de patience
          # suffisent — le scan tient largement dans les 10 minutes du job.
          # ⚠️ Un 403 n'est PAS un lien mort : c'est la réponse d'un serveur À UN
          # ROBOT. L'issue #450 de app-mezieres portait trois « erreurs » sur
          # quatre de cette nature (xpfibre.com/loiret-thd, cité ici aussi par la
          # règle `fibre`) — des pages qui s'ouvrent normalement dans un
          # navigateur. La réponse n'est pas d'allonger la liste d'exclusions
          # ci-dessous : un domaine exclu n'est PLUS JAMAIS vérifié, y compris le
          # jour où il meurt pour de bon — c'est précisément ce que ce scan
          # existe pour attraper (valdeloire-fibre.fr, domaine inexistant,
          # annoncé aux habitants pendant des mois). L'étape suivante re-teste
          # donc chaque URL signalée avec des en-têtes de navigateur : ce qui
          # répond sort du rapport, ce qui ne répond pas y reste.
          args: >-
            --no-progress
            --max-retries 2
            --max-concurrency 8
            --timeout 30
            --exclude 'facebook\.com'
            --exclude 'instagram\.com'
            --exclude 'linkedin\.com'
            --exclude 'claude\.ai'
            --exclude 'chatgpt\.com'
            --exclude 'chat\.mistral\.ai'
            --exclude 'console\.mistral\.ai'
            --exclude 'console\.anthropic\.com'
            --exclude 'dashboard\.render\.com'
            --exclude 'onrender\.com'
            --exclude 'api\.trello\.com'
            --exclude 'graph\.facebook\.com'
            --exclude 'api\.cloudinary\.com'
            --exclude 'public-api\.meteofrance\.fr'
            --exclude 'hubeau\.eaufrance\.fr'
            --exclude 'api\.vigieau\.gouv\.fr'
            --exclude 'www\.vigicrues\.gouv\.fr'
            --exclude 'sentry\.io'
            --exclude 'localhost'
            --exclude 'api\.anthropic\.com'
            --exclude 'api\.mistral\.ai'
            --exclude 'api\.resend\.com'
            --exclude 'trello\.com'
            --exclude 'overpass-api\.de'
            --exclude 'apicarto\.ign\.fr'
            --exclude 'open-meteo\.com'
            --exclude 'upstash\.io'
            --exclude 'api\.upstash\.com'
            --exclude 'mezieres-lez-clery\.fr/img/'
            'lib/*.js' 'routes/*.js' '*.md' 'docs/**/*.md'
          # JSON : le rapport lisible est construit par l'étape suivante, une
          # fois les faux positifs écartés.
          format: json
          output: ./lychee/rapport.json
          fail: false

      # Re-vérification « pour de vrai » : chaque URL que lychee a rejetée est
      # rappelée avec des en-têtes de navigateur. Celles qui répondent sont
      # écartées du rapport (et listées dans un bloc repliable, pour qu'un faux
      # positif reste visible sans faire de bruit) ; les autres y restent.
      # C'est cette étape qui décide, pas le code de sortie de lychee.
      - name: Re-vérifier les liens signalés
        id: verif
        run: node scripts/verifier-liens-signales.js ./lychee/rapport.json ./lychee/rapport.md

      # ⚠️ Sans cette recherche, chaque passage hebdomadaire ouvrait une issue
      # DE PLUS, au lieu de mettre à jour l'existante : #176 et #181 étaient
      # identiques mot pour mot, à un jour d'intervalle. Le rapport de lychee
      # décrit un état courant, pas un événement — une seule issue vivante suffit.
      - name: Chercher une issue « liens-morts » déjà ouverte
        id: issue_ouverte
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          numero=$(gh issue list --repo "$GITHUB_REPOSITORY" \
                     --label liens-morts --state open --limit 1 \
                     --json number --jq '.[0].number // ""')
          echo "numero=$numero" >> "$GITHUB_OUTPUT"
          echo "Issue liens-morts ouverte : ${numero:-aucune}"

      - name: Créer ou mettre à jour l'issue si des liens sont cassés
        if: steps.verif.outputs.restants != '0'
        uses: peter-evans/create-issue-from-file@v6
        with:
          title: 🔗 Liens morts détectés dans les réponses de MEL
          content-filepath: ./lychee/rapport.md
          labels: liens-morts
          # Vide → création. Renseigné → mise à jour de l'issue existante.
          issue-number: ${{ steps.issue_ouverte.outputs.numero }}

      # Symétrique : quand tout repasse au vert, l'issue n'a plus de raison de
      # rester ouverte. Sans ça elle traîne jusqu'à ce que quelqu'un y pense.
      - name: Refermer l'issue si plus aucun lien n'est cassé
        if: steps.verif.outputs.restants == '0' && steps.issue_ouverte.outputs.numero != ''
        env:
          GH_TOKEN: ${{ github.token }}
          NUMERO: ${{ steps.issue_ouverte.outputs.numero }}
        run: |
          gh issue comment "$NUMERO" --repo "$GITHUB_REPOSITORY" \
            --body "✅ Scan du $(date -u '+%d/%m/%Y') : plus aucun lien cassé. Refermée automatiquement."
          gh issue close "$NUMERO" --repo "$GITHUB_REPOSITORY" --reason completed
