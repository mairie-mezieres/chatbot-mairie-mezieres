name: CI

on:
  push:
    branches:
      - main
      - 'claude/**'
  pull_request:
    branches:
      - main

jobs:
  ci:
    name: Syntax & Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Syntax check (all JS)
        run: |
          find . -name '*.js' -not -path './node_modules/*' \
            | sort | xargs -I{} node --check {}

      # `null == false` est VRAI dans une expression Actions (les deux opérandes
      # sont castés en nombre). Une entrée `workflow_dispatch` comparée à `false`
      # se déclenche donc toute seule hors lancement manuel : les mises à jour
      # mineures de `dependabot-auto-merge.yml` étaient désactivées dans le seul
      # mode qui compte, et le lancement manuel — le seul qu'on essaie — prenait
      # le bon chemin. Voir `app-mezieres/docs/adr/0045-…` §8.
      - name: Workflow inputs check (null == false)
        run: node scripts/check-workflow-inputs.js

      - name: Tests (golden-master + routes d'intégration)
        run: npm test

      # Audit de sécurité des dépendances — non bloquant : signale les avis de
      # niveau « high »+ sans empêcher la fusion (un avis transitif non corrigeable
      # ne doit pas bloquer une PR fonctionnelle). Dependabot ouvre les correctifs.
      - name: Audit npm (sécurité, non bloquant)
        run: npm audit --audit-level=high
        continue-on-error: true
