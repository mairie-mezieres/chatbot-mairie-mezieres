name: CI

on:
  push:
    branches:
      - main
      - 'claude/**'
  pull_request:
    branches:
      - main

jobs:
  ci:
    name: Syntax & Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Syntax check (all JS)
        run: |
          find . -name '*.js' -not -path './node_modules/*' \
            | sort | xargs -I{} node --check {}

      - name: Tests (golden-master + routes d'intégration)
        run: npm test
