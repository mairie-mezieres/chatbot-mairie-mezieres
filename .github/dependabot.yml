# Dependabot — mises à jour automatiques des dépendances.
# Ouvre une pull request quand une nouvelle version (ou un correctif de
# sécurité) est disponible. Regroupé par écosystème pour limiter le nombre de PR.
version: 2
updates:
  # Versions des actions utilisées dans les workflows (.github/workflows/*)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      github-actions:
        patterns: ["*"]

  # Dépendances npm du serveur (express, axios, web-push, googleapis…)
  #
  # ⚠️ Le groupe est volontairement limité à `minor` et `patch`. Sans cette
  # restriction, `patterns: ["*"]` empaquetait TOUT, majeures comprises : la
  # PR #151 réunissait ainsi six mises à jour dont quatre montées majeures —
  # googleapis 134→173 (l'agenda), @sentry/node 8→10 (les erreurs),
  # @anthropic-ai/sdk 0.50→0.115 (MEL) et express-rate-limit 7→8. En bloc, un
  # test rouge ne dit pas laquelle est en cause, et un test vert ne prouve rien :
  # la CI n'exerce ni le calendrier Google ni un échange réel avec l'API
  # Anthropic. Fermée sans être relue, faute de pouvoir l'être.
  #
  # Avec `update-types`, dependabot ouvre une PR SÉPARÉE par montée majeure —
  # relisable, testable, réversible seule — tout en gardant le train
  # minor/patch groupé pour limiter le bruit.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      backend:
        patterns: ["*"]
        update-types: ["minor", "patch"]
        # ⚠️ Trou de `update-types` sur les paquets `0.x`. En semver strict,
        # `0.50.4 → 0.115.0` est une montée MINEURE (le majeur reste 0) : le
        # filtre ci-dessus ne l'écarte donc pas. C'est ainsi que la PR #186 a
        # regroupé un saut de 65 versions du SDK Anthropic — celui qui fait
        # parler MEL, avec 6 nouvelles dépendances transitives — derrière un
        # innocent bump d'axios.
        #
        # Aucun réglage dependabot ne permet de traiter « mineure de 0.x »
        # comme une majeure. L'exclusion nommée est la seule voie : le SDK
        # aura toujours sa propre PR, relisable seule.
        exclude-patterns: ["@anthropic-ai/sdk"]
